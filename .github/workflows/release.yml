name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: mayanklahiri/virtualme

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          [ "v$PKG" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$PKG"; exit 1; }
      - name: Immutability — version tags absent from Docker Hub
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for tag in "$VERSION" "$VERSION-amd64" "$VERSION-arm64"; do
            if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo "refusing to release: $IMAGE:$tag already exists on Docker Hub" >&2
              exit 1
            fi
          done
      - name: Immutability — version absent from npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -n "$(npm view "virtualme@$VERSION" version 2>/dev/null)" ]; then
            echo "refusing to release: virtualme@$VERSION already exists on npm" >&2
            exit 1
          fi
      - name: Release notes present
        run: test -s "release-notes/$GITHUB_REF_NAME.md" || { echo "missing release-notes/$GITHUB_REF_NAME.md" >&2; exit 1; }

  docker-arch:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push per-arch image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker build --build-arg VERSION="$VERSION" -f docker/Dockerfile -t "$IMAGE:$VERSION-${{ matrix.arch }}" .
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  docker-manifest:
    needs: docker-arch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifests
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      - name: Update Docker Hub overview
        run: |
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"username":"'"${{ secrets.DOCKERHUB_USERNAME }}"'","password":"'"${{ secrets.DOCKERHUB_TOKEN }}"'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          jq -n --rawfile body docker/DOCKERHUB.md \
            '{full_description:$body, description:"Private local background agent: local LLM, virtual browser, speech, mail. No cloud."}' \
          | curl -fsS -X PATCH -H "Authorization: JWT $TOKEN" -H 'Content-Type: application/json' \
              -d @- "https://hub.docker.com/v2/repositories/$IMAGE/"

  npm-publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: CHECK_SKIP_GO=1 npm run check
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [docker-manifest, npm-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release with Marvin notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "release-notes/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --notes "$(cat "release-notes/$GITHUB_REF_NAME.md"; echo; echo '---'; gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)"
